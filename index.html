<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the on-screen keyboard shrinks the layout viewport rather
         than sliding over it. Without it the keyboard covers the bottom of the app,
         which is exactly where the block being edited usually is. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- Must match theme_color in the PWA manifest (generated by vite-plugin-pwa) -->
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- No rel="manifest" here. vite-plugin-pwa injects it, and with two of them only
         the first is used, which kills file_handlers. -->
    <title>nighteditor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
