name: CI

on: [push, pull_request]

# The verification logic is never written out here. Once local and CI drift apart,
# checking before a push stops meaning anything. (docs/rules.md §5.2)
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
